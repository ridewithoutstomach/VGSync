# Testet ein FERTIGES macOS-Programm auf einem Rechner, der es nicht gebaut hat.
#
# WOZU
# ====
# Der Bau-Rechner ist als Pruefstand untauglich. Dort liegen Python, Qt und
# GStreamer ohnehin herum. Fehlt etwas IM Programm, findet der Bau-Rechner es
# trotzdem woanders - und nur der Anwender, der es nicht hat, bekommt den
# Absturz. Dieser Workflow startet deshalb auf einem frischen Rechner, laedt
# nur das fertige Archiv herunter und installiert NICHTS.
#
# Was hier gefunden wird, ist beim Anwender genauso wahr.
# Was hier NICHT geprueft werden kann, steht am Ende jedes Laufs.
#
# STARTEN
# =======
# Actions -> "3 - Fertiges Programm testen" -> Run workflow.
# Laeuft nie von allein.
#
# Die Vorbelegung testet das neueste Release - also genau die Datei, die sich
# ein Anwender heute herunterlaedt.
#
# Wurde neu gebaut, ohne ein Release zu erstellen: woher = "Build-Lauf" und
# bei bezeichnung die Nummer des Bau-Laufs eintragen. Die steht in der
# Adresszeile des Laufs, hinten (.../actions/runs/DIESE-NUMMER).

name: 3 - Fertiges Programm testen

on:
  workflow_dispatch:
    inputs:
      woher:
        description: "Woher kommt das Programm?"
        type: choice
        default: "Release"
        options:
          - "Release"
          - "Build-Lauf"
      bezeichnung:
        description: "Release-Kennung (z.B. v6.03) oder Nummer des Bau-Laufs. Leer = neuestes Release"
        type: string
        default: ""
      arch:
        description: "Welche Fassung?"
        type: choice
        default: "beide"
        options:
          - "beide"
          - "arm64"
          - "x86_64"
      macos:
        description: "Auf welchem macOS testen?"
        type: choice
        default: "beide"
        options:
          - "beide"
          - "15"
          - "26"

# Nur lesen. contents fuer Releases, actions fuer Artefakte aus Bau-Laeufen.
permissions:
  contents: read
  actions: read

jobs:

  # ---------------------------------------------------------------------
  # Stellt zusammen, welche Laeufe wirklich noetig sind.
  #
  # Ohne diesen Schritt liefen immer vier Rechner - zwei Fassungen mal zwei
  # macOS-Versionen. Wer nur eine Sache pruefen will, soll nicht drei
  # Rechner unbeteiligt mitlaufen lassen. Der Schritt selbst laeuft auf
  # Linux, weil das die billigste Maschine ist.
  # ---------------------------------------------------------------------
  auswahl:
    name: Was wird getestet?
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.bauen.outputs.matrix }}
    steps:
      - name: Liste der Laeufe zusammenstellen
        id: bauen
        run: |
          set -euo pipefail
          case "${{ inputs.arch }}" in
            arm64)  ARCHS="arm64" ;;
            x86_64) ARCHS="x86_64" ;;
            *)      ARCHS="arm64 x86_64" ;;
          esac
          case "${{ inputs.macos }}" in
            15) VERSIONEN="15" ;;
            26) VERSIONEN="26" ;;
            *)  VERSIONEN="15 26" ;;
          esac

          EINTRAEGE=""
          for A in $ARCHS; do
            for V in $VERSIONEN; do
              # Apple Silicon heisst bei GitHub "macos-<Version>",
              # Intel heisst "macos-<Version>-intel".
              if [ "$A" = "arm64" ]; then LAEUFER="macos-$V"; else LAEUFER="macos-$V-intel"; fi
              EINTRAEGE="$EINTRAEGE{\"arch\":\"$A\",\"laeufer\":\"$LAEUFER\"},"
            done
          done
          MATRIX="{\"include\":[${EINTRAEGE%,}]}"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Der eigentliche Pruefstand.
  # ---------------------------------------------------------------------
  pruefen:
    needs: auswahl
    name: ${{ matrix.arch }} auf ${{ matrix.laeufer }}
    runs-on: ${{ matrix.laeufer }}
    timeout-minutes: 40
    strategy:
      fail-fast: false        # ein rotes Ziel stoppt die anderen nicht
      matrix: ${{ fromJSON(needs.auswahl.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - name: Womit wird hier geprueft?
        run: |
          echo "Rechner   : $(uname -m) / macOS $(sw_vers -productVersion)"
          echo "Laeufer   : ${{ matrix.laeufer }}"
          echo "Getestet  : ${{ matrix.arch }}"
          echo "Quelle    : ${{ inputs.woher }} ${{ inputs.bezeichnung }}"
          echo
          echo "Auf diesem Rechner wird NICHT gebaut und NICHTS installiert."
          echo "Kein pip, kein setup-python, kein Quelltext der Anwendung."
          echo "Das ist der ganze Sinn dieses Workflows."

      # Nur der Pruefer, nicht die Anwendung. Laege hier der Quelltext von
      # KVRouite, koennte das Programm im Zweifel Dateien von dort statt aus
      # seinem eigenen Buendel nehmen - und dann wuerde wieder nichts
      # bewiesen. Deshalb sparse-checkout, und nur tools/.
      - name: Nur das Pruefwerkzeug holen
        uses: actions/checkout@v4
        with:
          sparse-checkout: /tools/
          sparse-checkout-cone-mode: false
          path: pruefwerkzeug

      - name: Archiv herunterladen
        run: |
          set -euo pipefail
          mkdir -p archiv && cd archiv
          if [ "${{ inputs.woher }}" = "Build-Lauf" ]; then
            NUMMER="${{ inputs.bezeichnung }}"
            if [ -z "$NUMMER" ]; then
              echo "ABBRUCH: Bei 'Build-Lauf' muss die Nummer des Laufs angegeben werden."
              echo "Sie steht hinten in der Adresse des Laufs: .../actions/runs/NUMMER"
              exit 1
            fi
            echo "Hole Artefakt aus Bau-Lauf $NUMMER"
            gh run download "$NUMMER" \
               --repo "${{ github.repository }}" \
               --name "KVRouite-macOS-${{ matrix.arch }}" \
               --dir .
          else
            TAG="${{ inputs.bezeichnung }}"
            if [ -z "$TAG" ]; then
              echo "Hole das neueste Release"
            else
              echo "Hole Release $TAG"
            fi
            gh release download $TAG \
               --repo "${{ github.repository }}" \
               --pattern "*_macOS_${{ matrix.arch }}.zip" \
               --dir .
          fi
          echo
          echo "Heruntergeladen:"
          ls -lh

      - name: Auspacken wie im Finder
        run: |
          set -euo pipefail
          ZIP=$(find archiv -name "*_macOS_${{ matrix.arch }}.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "ABBRUCH: kein passendes Archiv heruntergeladen."
            echo "Gefunden wurde:"
            find archiv -type f
            exit 1
          fi
          echo "Archiv: $ZIP"
          # ditto ist das Programm, das auch der Finder zum Auspacken nimmt.
          # unzip wuerde Symlinks und Rechte anders behandeln und damit ein
          # Buendel erzeugen, das der Anwender so nie bekommt.
          rm -rf entpackt && mkdir entpackt
          ditto -x -k "$ZIP" entpackt
          APP=$(find entpackt -maxdepth 2 -name "KVRouite.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ABBRUCH: im Archiv steckt kein KVRouite.app."
            exit 1
          fi
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"
          echo "Geprueft wird: $PWD/$APP"

          # Die Fassung steht im Archivnamen (KVRouite_6.03_macOS_arm64.zip).
          # Sie wird im naechsten Schritt gebraucht und laesst sich hier nicht
          # anders holen: PyInstaller traegt keine Version in die Info.plist
          # ein (die Stichprobe vom 04.09.2026 zeigte "Version: 0.0.0").
          VERSION=$(basename "$ZIP" | sed -E 's/^KVRouite_(.+)_macOS_[a-z0-9_]+\.zip$/\1/')
          if [ "$VERSION" = "$(basename "$ZIP")" ]; then
            echo "ABBRUCH: aus '$(basename "$ZIP")' laesst sich keine Fassung lesen."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Fassung laut Archivname: $VERSION"

      - name: Zustand herstellen, den der Anwender hat
        run: |
          # Der einzige Unterschied zwischen "aus dem Netz geladen" und
          # "selbst hingelegt" ist ein Dateimerkmal, das der Browser setzt.
          # Erst damit schaut die Schutzfunktion von macOS ueberhaupt hin.
          # Ein Test ohne dieses Merkmal prueft einen Zustand, in dem sich
          # kein Anwender je befindet.
          xattr -w com.apple.quarantine \
                "0081;$(printf %x $(date +%s));Safari;$(uuidgen)" "$APP"
          echo "----- Dateimerkmale -----"
          xattr -l "$APP"
          echo
          echo "----- Was die Schutzfunktion sagt -----"
          # Ohne Notarisierung sagt sie zwangslaeufig nein. Das ist so
          # entschieden. Wichtig ist, WAS sie sagt: "not notarized" ist der
          # bekannte Stand. Steht dort etwas ueber ein ungueltiges oder
          # unvollstaendiges Siegel, ist wirklich etwas kaputt.
          spctl -a -t exec -vv "$APP" 2>&1 || true

          echo
          echo "----- Merkmal wieder entfernen -----"
          # Das Urteil ist jetzt protokolliert, und damit ist die Aufgabe
          # dieses Merkmals erledigt. Ab hier muss es weg, sonst haelt die
          # Schutzfunktion jeden weiteren Schritt an einem Fenster fest,
          # das auf einem Mietrechner niemand wegklickt.
          #
          # Das ist keine Beschoenigung: es ist genau der Handgriff, den die
          # README vom Anwender verlangt - Rechtsklick > Oeffnen, oder
          # xattr -dr. Alles ab hier misst also den Zustand, in dem der
          # Anwender das Programm wirklich benutzt: durchgelassen.
          #
          # Am 04.09.2026 stand das Entfernen weiter hinten, und der
          # Bildnachweis blieb deshalb mit echtem Fenster an einem Dialog
          # haengen, bis die Frist ablief.
          xattr -dr com.apple.quarantine "$APP"
          xattr -l "$APP"
          echo "(keine Zeile darueber = kein Merkmal mehr gesetzt)"

      # =================================================================
      # TEIL 1 - die Datei selbst.
      #
      # Alles hier ist eine Eigenschaft der Datei und gilt deshalb auf
      # JEDEM Mac gleich. Ein Fund hier ist ein echter Fund.
      # =================================================================
      - name: Das Buendel auseinandernehmen
        run: |
          # Findet dieser Schritt etwas, endet der Lauf hier. Was danach
          # kaeme, wuerde an einem Buendel gemessen, von dem schon feststeht,
          # dass es nicht in Ordnung ist.
          set -euo pipefail
          echo "python3: $(command -v python3)"
          python3 pruefwerkzeug/tools/pruefe_macos_buendel.py "$APP" \
                  --erwartete-arch "${{ matrix.arch }}" \
                  --min-os 15.0

      - name: Erststart-Dialoge wegnehmen
        run: |
          set -euo pipefail
          # OHNE DIESEN SCHRITT BLEIBT ALLES STEHEN.
          #
          # Beim allerersten Start zeigt KVRouite zwei modale Fenster und
          # wartet auf einen Klick:
          #   1. den Disclaimer          (KVRouite.py:616, config.py:357)
          #   2. "ffmpeg not found"      (KVRouite.py:557)
          # Auf einem frischen Mietrechner ist JEDER Start der erste, und
          # klicken kann dort niemand.
          #
          # Genau das macht build-macos.yml seit jeher mit einem Aufruf von
          # QSettings ueber PySide6. Hier geht das nicht - auf diesem Rechner
          # ist absichtlich kein PySide6 installiert. Deshalb derselbe Inhalt
          # ueber "defaults", das Bordmittel von macOS.
          #
          # Am 04.09.2026 hat genau dieser fehlende Schritt zwei Laeufe
          # gekostet: die Stichprobe zeigte den Prozess in QDialog::exec()
          # bzw. -[NSAlert runModal], also wartend auf einen Klick.
          #
          # Die Dialoge beim LADEN von Video und GPX ("Edit video",
          # Bildrate) sind davon unberuehrt - die beantwortet das Programm
          # selbst, siehe nachweis.py, _dialoge_beantworten.
          #
          # Der Name der Ablage: QSettings("KVRouite","KVRouite") landet
          # laut Qt-Dokumentation unter com.<Firma>.<Programm> - Qt haengt
          # an einen Firmennamen ohne Punkt ein ".com" an und dreht um.
          BEREICH=com.KVRouite.KVRouite

          echo "----- vorher -----"
          defaults read "$BEREICH" 2>/dev/null || echo "(noch keine Ablage)"

          # appVersion MUSS mitgesetzt werden: passt sie nicht zur Fassung
          # des Programms, loescht config.check_app_version_and_reset_if_necessary()
          # den Disclaimer-Haken wieder und das Fenster kaeme trotzdem.
          defaults write "$BEREICH" appVersion -string "$VERSION"
          defaults write "$BEREICH" disclaimerAccepted -bool true

          # "hints/ffmpeg_missing_shown" ist ein Schluessel MIT Gruppe.
          # Qt legt ihn auf macOS NICHT verschachtelt ab, sondern als einen
          # flachen Schluessel, in dem der Schraegstrich zum Punkt wird:
          # qsettings_mac.cpp, rotateSlashesDotsAndMiddots() -> macKey().
          # Also "hints.ffmpeg_missing_shown". Nachgelesen im Qt-Quelltext
          # am 04.09.2026, nachdem zwei geratene Formen nicht gegriffen
          # hatten und der Lauf beide Male an genau diesem Fenster hing.
          #
          # ffmpeg ist auf keinem GitHub-Laeufer vorhanden (runner-images,
          # macos-15 und macos-15-arm64: nicht in der Werkzeugliste), das
          # Fenster kaeme also IMMER. Und es kommt VOR dem Disclaimer
          # (KVRouite.py: Hinweis ~Zeile 581, Disclaimer ~616).
          defaults write "$BEREICH" "hints.ffmpeg_missing_shown" -bool true

          echo
          echo "----- nachher -----"
          defaults read "$BEREICH"
          echo
          echo "Ablage: $HOME/Library/Preferences/$BEREICH.plist"
          ls -l "$HOME/Library/Preferences/$BEREICH.plist"

      # =================================================================
      # TEIL 2 - der Weg des Anwenders: Doppelklick.
      #
      # Die einfachste Frage zuerst: startet das Ding ueberhaupt? Wenn
      # nicht, braucht man die aufwendigen Schritte danach gar nicht.
      #
      # Dass das Quarantaene-Merkmal schon im Schritt "Zustand herstellen"
      # entfernt wurde, ist die Voraussetzung dafuer. Am 04.09.2026 stand
      # das Entfernen weiter hinten - dieser Schritt blieb an einem
      # Gatekeeper-Fenster stehen, das auf einem Mietrechner niemand
      # wegklickt, und der Auftrag lief in die 40-Minuten-Frist.
      # =================================================================
      - name: Doppelklick - startet es ueberhaupt?
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "open \"$APP\""
          # Im Hintergrund. Bleibt open trotzdem stehen, laeuft dieser
          # Schritt nach 3 Minuten in seine eigene Frist und wird rot -
          # statt den ganzen Auftrag 40 Minuten lang zu blockieren.
          open "$APP" &

          sleep 25
          if pgrep -f "KVRouite.app/Contents/MacOS/KVRouite" > /dev/null; then
            echo "ERGEBNIS: laeuft nach 25 Sekunden noch."
            pkill -f "KVRouite.app/Contents/MacOS/KVRouite"
          else
            echo "ERGEBNIS: der Prozess ist nach 25 Sekunden nicht da."
            echo "Entweder abgestuerzt, nie gestartet, oder open haengt"
            echo "noch. Welches von dreien, steht in den Absturzberichten"
            echo "und in der Ausgabe oben."
            exit 1
          fi

      # =================================================================
      # TEIL 3 - kann das Programm arbeiten?
      #
      # Hier entscheidet der Rueckgabewert, und zwar ausnahmslos.
      #
      # Genau das war bisher der Fehler: der Bau-Workflow zaehlt bei den
      # Bildern die Dateien statt auf den Rueckgabewert zu sehen. Am
      # 03.09.2026 ist das Programm dabei mit einem Absturz ausgestiegen -
      # die drei Bilder waren fertig, also war der Lauf gruen. Ein Test,
      # dem man sagt, er soll wegsehen, sagt einem hinterher nichts.
      # =================================================================
      - name: Selbsttest - findet das Programm seine eigenen Dateien?
        run: |
          set -euo pipefail
          # Aus einem leeren Ordner heraus. Beim Doppelklick ist das
          # Arbeitsverzeichnis nicht der Programmordner - liegt hier etwas
          # herum, koennte das Programm es faelschlich benutzen.
          rm -rf leer && mkdir leer && cd leer
          # env -i raeumt die Umgebung leer. Grund: der Bau-Rechner setzt
          # GST_PLUGIN_PATH und aehnliches. Erbte der Test diese Werte,
          # faende das Programm seine Bestandteile ueber die Umgebung
          # statt in sich selbst - und wir haetten wieder nichts bewiesen.
          # Der Anwender hat diese Werte auch nicht.
          # Hier ist offscreen richtig, im Bildnachweis darunter falsch:
          # dieser Schritt fragt "findet das Programm seine Dateien", nicht
          # "kann es zeichnen". selftest.py setzt den Wert ohnehin selbst
          # (selftest.py, os.environ.setdefault) - er steht hier nur, damit
          # der Unterschied zum naechsten Schritt sichtbar ist.
          env -i HOME="$HOME" PATH=/usr/bin:/bin USER="$USER" \
                 TMPDIR="${TMPDIR:-/tmp}" LANG=en_US.UTF-8 \
                 QT_QPA_PLATFORM=offscreen \
                 "$APP/Contents/MacOS/KVRouite" --selftest

      # =================================================================
      # Der Schritt, wegen dem es diesen Workflow gibt.
      #
      # MIT ECHTEM FENSTER, nicht offscreen. Das ist der Unterschied zu
      # allem, was bisher gemessen wurde.
      #
      # Bis zum 04.09.2026 lief jeder Test - der im Bau-Workflow und mein
      # erster Entwurf hier - mit QT_QPA_PLATFORM=offscreen. Damit sind
      # Fenster, OpenGL und der Zeichenweg von QtWebEngine ausgeschaltet,
      # also genau die Bereiche, in denen ein Absturz bei einem Programm
      # dieser Bauart am ehesten steckt. Wir haben um die Stelle
      # herumgemessen, um die es geht. Ein Anwender laeuft nicht offscreen.
      #
      # Drei Durchlaeufe, nicht einer: der Absturz vom 03.09.2026 trat
      # beim Abraeumen von GStreamer und QtWebEngine auf, und so etwas ist
      # selten jedes Mal da. Ein gruener Einzeldurchlauf sagt wenig.
      # Bricht einer ab, endet der Schritt sofort - der Rest der Durchlaeufe
      # wuerde nichts mehr hinzufuegen.
      # =================================================================
      - name: Bildnachweis - Video und Spur laden, abspielen, Bilder machen
        # Ein Durchlauf kostet rund 10 Sekunden, drei also eine halbe
        # Minute. 10 Minuten sind reichlich - und kurz genug, dass ein
        # Haenger auffaellt, statt eine halbe Stunde zu kosten.
        timeout-minutes: 10
        run: |
          set -euo pipefail

          # Wie lange ein einzelner Durchlauf hoechstens dauern darf.
          # Gemessen kostet einer rund 10 Sekunden; 120 sind also weit
          # jenseits von "dauert halt".
          FRIST=120

          for DURCHLAUF in 1 2 3; do
            echo "===================== Durchlauf $DURCHLAUF von 3 ====================="
            ORDNER="bilder/lauf_$DURCHLAUF"
            rm -rf "$ORDNER"
            mkdir -p "$ORDNER"

            # Im Hintergrund, damit wir mitbekommen, WENN er stehenbleibt.
            #
            # Am 04.09.2026 blieb dieser Schritt zweimal stehen und im
            # Protokoll stand nichts ausser der Ueberschrift. Ein Haenger
            # ohne Auskunft ist wertlos - man weiss hinterher genau so
            # wenig wie vorher. Deshalb wird jetzt gewartet, und wenn die
            # Frist reisst, wird nachgesehen statt geraten.
            #
            # Das Programm erzeugt sein Testvideo und seine Testspur selbst
            # und beantwortet seine eigenen Rueckfragen - es wird nichts von
            # aussen zugereicht.
            #
            # env -i raeumt die Umgebung leer, damit das Programm seine
            # Bestandteile in sich selbst finden muss und nicht ueber
            # geerbte Werte des Laeufers. QT_QPA_PLATFORM wird bewusst
            # NICHT gesetzt - Qt nimmt dann den echten Weg ueber das
            # Fenstersystem, so wie beim Anwender.
            (
              cd "$ORDNER"
              env -i HOME="$HOME" PATH=/usr/bin:/bin USER="$USER" \
                     TMPDIR="${TMPDIR:-/tmp}" LANG=en_US.UTF-8 \
                     KVROUITE_PROOF_SIZE=1920x1200 \
                     "$APP/Contents/MacOS/KVRouite" --screenshot
            ) &
            PID=$!

            WARTE=0
            while kill -0 "$PID" 2>/dev/null && [ "$WARTE" -lt "$FRIST" ]; do
              sleep 2
              WARTE=$((WARTE + 2))
            done

            if kill -0 "$PID" 2>/dev/null; then
              echo
              echo "HAENGER: Durchlauf $DURCHLAUF laeuft seit $FRIST Sekunden"
              echo "und ist nicht fertig geworden."
              echo
              echo "----- Wo genau es steht -----"
              # "sample" gehoert zu macOS und schreibt auf, in welcher
              # Funktion jeder Faden des Prozesses gerade steckt. Das ist
              # die Antwort auf die Frage, die wir sonst nur raten koennen:
              # wartet es auf die Grafik, auf GStreamer, oder auf ein
              # Fenster, das niemand wegklickt.
              #
              # Der echte Prozess ist ein Kind der Klammer oben, deshalb
              # wird er ueber seinen Namen gesucht und nicht ueber $PID.
              ECHTE_PID=$(pgrep -f "KVRouite.app/Contents/MacOS/KVRouite" | head -1 || true)
              echo "Prozess: ${ECHTE_PID:-nicht gefunden}"
              if [ -n "$ECHTE_PID" ]; then
                sample "$ECHTE_PID" 5 -file "$ORDNER/stichprobe.txt" || true
                cat "$ORDNER/stichprobe.txt" || true
              fi
              echo
              echo "----- was bis hierhin entstanden ist -----"
              ls -1 "$ORDNER" || true
              pkill -f "KVRouite.app/Contents/MacOS/KVRouite" || true
              kill -9 "$PID" 2>/dev/null || true
              exit 1
            fi

            # Der Rueckgabewert des Durchlaufs. Stuerzt das Programm ab,
            # endet der Schritt hier - auch wenn die Bilder schon da sind.
            wait "$PID"

            echo "----- entstanden -----"
            ls -1 "$ORDNER"
            echo "----- Antwort der Kartenseite -----"
            cat "$ORDNER/KVRouite_proof_map.txt" 2>/dev/null \
              || echo "(keine Antwort)"
            echo
          done
          echo "Alle drei Durchlaeufe sind ohne Absturz zu Ende gekommen."

      # =================================================================
      # Was danach kommt, laeuft IMMER - gerade wenn oben etwas rot war.
      # =================================================================
      - name: Hat das Laufen das Buendel veraendert?
        if: always()
        run: |
          # Legt das Programm beim ersten Start etwas in seinen eigenen
          # Ordner, waere es beim Anwender ab da "veraendert" und wuerde
          # beim naechsten Mal abgewiesen.
          codesign --verify --deep --strict --verbose=2 "$APP" \
            && echo "OK: unveraendert."

      - name: Absturzberichte einsammeln
        if: always()
        run: |
          mkdir -p absturzberichte
          ORDNER=~/Library/Logs/DiagnosticReports
          if [ -d "$ORDNER" ]; then
            cp "$ORDNER"/*KVRouite* absturzberichte/ 2>/dev/null || true
          fi
          ANZAHL=$(ls -1 absturzberichte 2>/dev/null | wc -l | tr -d " ")
          echo "Absturzberichte zu KVRouite: $ANZAHL"
          if [ "$ANZAHL" -gt 0 ]; then
            echo
            for DATEI in absturzberichte/*; do
              echo "===== $(basename "$DATEI") ====="
              # Der Kopf reicht. Dort stehen Exception Type und Termination
              # Reason - alles Weitere sind Adressen und hilft hier nicht.
              head -40 "$DATEI"
              echo
            done
          else
            echo
            echo "Kein Bericht. Das ist KEINE Entwarnung: wird ein Programm"
            echo "wegen eines Siegelproblems vom System abgeraeumt, entsteht"
            echo "unter Umstaenden gar keiner. Dann sagt Teil 1 mehr."
          fi

      - name: Bilder und Berichte ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.arch }}-${{ matrix.laeufer }}
          path: |
            bilder/
            absturzberichte/
          if-no-files-found: warn
          retention-days: 14

      # =================================================================
      # Damit am Ende nicht nur "gruen" steht, sondern wofuer das gruen gilt.
      # =================================================================
      - name: Was dieser Lauf beweist - und was nicht
        if: always()
        run: |
          {
            echo "### ${{ matrix.arch }} auf ${{ matrix.laeufer }}"
            echo ""
            echo "Ergebnis der Schritte oben: **${{ job.status }}**"
            echo ""
            echo "**Geprueft, und zwar gueltig fuer jeden Mac:**"
            echo ""
            echo "- Ist das Buendel gueltig signiert und vollstaendig versiegelt?"
            echo "- Passt die Fassung zu dem, was der Dateiname verspricht?"
            echo "- Verweist eine Bibliothek aus dem Buendel heraus?"
            echo "- Ab welchem macOS laeuft es laut seinen eigenen Angaben?"
            echo "- Findet es seine mitgelieferten Dateien ohne fremde Hilfe?"
            echo "- Laeuft es ab, ohne unterwegs oder beim Beenden abzustuerzen?"
            echo ""
            echo "**Von hier aus NICHT pruefbar:**"
            echo ""
            echo "- Die Grafikkarte des Anwenders. Dieser Rechner hat eine"
            echo "  nachgebildete. Die Karte wird auf Apple Silicon anders"
            echo "  gezeichnet als auf Intel, bei gleichem Programm."
            echo "- macOS 13 und 14. Diese Rechner gibt es bei GitHub nicht"
            echo "  mehr - es sind nur noch 15 und 26 verfuegbar. Ob das"
            echo "  Programm dort startet, sagt allein die Mindestangabe aus"
            echo "  Teil 1."
            echo "- Ob der Anwender sich die richtige Fassung geladen hat."
            echo "- Fremde Software, Virenscanner, Bildschirmeinstellungen."
            echo ""
            echo "Ein gruener Lauf heisst also: an der Datei ist nichts falsch."
            echo "Er heisst nicht: beim Anwender laeuft es."
          } >> "$GITHUB_STEP_SUMMARY"
