# Prueft, ob KVRouite auf macOS installiert und startet.
#
# Laeuft auf GitHub-Rechnern, nicht bei dir. Fuer oeffentliche Repositories
# sind die macOS-Runner kostenlos.
#
# Ausloeser: bei jedem Push, und von Hand ueber den Reiter
# "Actions" -> "macOS" -> "Run workflow".

name: macOS

on:
  push:                   # laeuft auf jedem Branch, auf den du pushst
  workflow_dispatch:      # Knopf zum manuellen Starten

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30    # haengt nie laenger als eine halbe Stunde
    strategy:
      fail-fast: false     # ein defektes Ziel stoppt das andere nicht
      matrix:
        include:
          - os: macos-15         # Apple Silicon (arm64)
            python: "3.12"
          - os: macos-15-intel   # Intel (x86_64)
            python: "3.12"

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Umgebung anzeigen
        run: |
          echo "Rechner : $(uname -m) / $(sw_vers -productVersion)"
          echo "Python  : $(python --version)"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Was tatsaechlich installiert wurde
        run: pip list

      - name: GStreamer/GES pruefen (check_ges.py)
        run: python check_ges.py

      - name: Startest - Anwendung importieren, ohne Fenster zu oeffnen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import importlib, sys
          # KVRouite.py hat einen __main__-Guard, der Import startet also nichts.
          for modul in ("KVRouite", "config", "path_manager", "core.ges_backend"):
              importlib.import_module(modul)
              print("  ok:", modul)
          print("Alle Module importiert, Python", sys.version.split()[0])
          PY

      - name: Startversuch - laeuft die App bis zum Hauptfenster durch?
        timeout-minutes: 5          # haengt ein Dialog, schlaegt der Schritt fehl
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          from PySide6.QtCore import QSettings
          from PySide6.QtWidgets import QApplication

          import config, KVRouite

          # Beim allerersten Start zeigt KVRouite zwei modale Dialoge:
          #   1. den Disclaimer (KVRouite.py, is_disclaimer_accepted)
          #   2. "ffmpeg not found" (Merker hints/ffmpeg_missing_shown)
          # Beide warten auf einen Klick und wuerden hier ewig blockieren.
          # Sie werden deshalb vorab als "schon gesehen" hinterlegt - genau so,
          # wie es nach dem ersten echten Start eines Anwenders aussieht.
          # appVersion muss mitgesetzt werden, sonst loescht
          # check_app_version_and_reset_if_necessary() den Disclaimer-Merker.
          s = QSettings("KVRouite", "KVRouite")
          s.setValue("appVersion", config.APP_VERSION)
          s.setValue("disclaimerAccepted", True)
          s.setValue("hints/ffmpeg_missing_shown", True)
          s.sync()
          print("Vorbelegt fuer Version", config.APP_VERSION)

          # main() endet mit app.exec(). Statt dort in die Ereignisschleife zu
          # gehen, wird nachgesehen, welche Fenster offen sind - und zurueck.
          gefunden = []
          def statt_exec(self):
              for w in self.topLevelWidgets():
                  if w.isVisible():
                      gefunden.append((type(w).__name__, w.windowTitle()))
              return 0
          QApplication.exec = statt_exec

          try:
              KVRouite.main()
          except SystemExit as e:
              if e.code not in (0, None):
                  print("main() hat sich mit Code", e.code, "beendet")
                  sys.exit(1)

          print("Sichtbare Fenster beim Erreichen der Ereignisschleife:")
          for name, titel in gefunden:
              print("   ", name, "-", repr(titel))

          if any(n == "MainWindow" for n, _ in gefunden):
              print("ERGEBNIS: Hauptfenster wurde aufgebaut und angezeigt.")
          else:
              print("ERGEBNIS: KEIN Hauptfenster - die App kam nicht so weit.")
              sys.exit(1)
          PY

      - name: GStreamer-Plugins auflisten (zur Information)
        if: always()
        run: |
          python - <<'PY'
          import gi
          gi.require_version("Gst", "1.0")
          from gi.repository import Gst
          Gst.init(None)
          reg = Gst.Registry.get()
          namen = sorted(p.get_name() for p in reg.get_plugin_list())
          print(len(namen), "Plugins gefunden")
          for n in ("coreelements", "libav", "x264", "ges", "playback", "videoconvertscale"):
              print(("  vorhanden: " if n in namen else "  FEHLT   : ") + n)
          PY
