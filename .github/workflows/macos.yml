# Prueft, ob KVRouite auf macOS installiert und startet.
#
# Laeuft auf GitHub-Rechnern, nicht bei dir. Fuer oeffentliche Repositories
# sind die macOS-Runner kostenlos.
#
# Ausloeser: bei jedem Push, und von Hand ueber den Reiter
# "Actions" -> "macOS" -> "Run workflow".

name: macOS

on:
  push:                   # laeuft auf jedem Branch, auf den du pushst
  workflow_dispatch:      # Knopf zum manuellen Starten

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30    # haengt nie laenger als eine halbe Stunde
    strategy:
      fail-fast: false     # ein defektes Ziel stoppt das andere nicht
      matrix:
        include:
          - os: macos-15         # Apple Silicon (arm64)
            python: "3.12"
          - os: macos-15-intel   # Intel (x86_64)
            python: "3.12"
          - os: macos-26         # Apple Silicon auf der neuesten macOS-Fassung
            python: "3.12"
          - os: macos-26-intel   # Intel auf der neuesten macOS-Fassung
            python: "3.12"

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Umgebung anzeigen
        run: |
          echo "Rechner : $(uname -m) / $(sw_vers -productVersion)"
          echo "Python  : $(python --version)"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Was tatsaechlich installiert wurde
        run: pip list

      - name: GStreamer/GES pruefen (check_ges.py)
        run: python check_ges.py

      - name: Startest - Anwendung importieren, ohne Fenster zu oeffnen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import importlib, sys
          # KVRouite.py hat einen __main__-Guard, der Import startet also nichts.
          for modul in ("KVRouite", "config", "path_manager", "core.ges_backend"):
              importlib.import_module(modul)
              print("  ok:", modul)
          print("Alle Module importiert, Python", sys.version.split()[0])
          PY

      - name: Startversuch - laeuft die App bis zum Hauptfenster durch?
        timeout-minutes: 5          # haengt ein Dialog, schlaegt der Schritt fehl
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echo "HINWEIS: Meldungen der Form 'This plugin does not support ...'"
          echo "kommen vom Qt-Grafiktreiber 'offscreen', den dieser Test erzwingt."
          echo "Er hat kein Fenstersystem, also sind raise(), lower(), setParent"
          echo "und propagateSizeHints wirkungslos und werden gemeldet. Auf einem"
          echo "echten Mac laeuft Qt ueber 'cocoa' und keine dieser Zeilen kommt vor."
          echo "Sie sind KEINE Fehler. Massgeblich ist die ERGEBNIS-Zeile unten."
          echo
          python - <<'PY'
          import sys
          from PySide6.QtCore import QSettings
          from PySide6.QtWidgets import QApplication

          import config, KVRouite

          # Beim allerersten Start zeigt KVRouite zwei modale Dialoge:
          #   1. den Disclaimer (KVRouite.py, is_disclaimer_accepted)
          #   2. "ffmpeg not found" (Merker hints/ffmpeg_missing_shown)
          # Beide warten auf einen Klick und wuerden hier ewig blockieren.
          # Sie werden deshalb vorab als "schon gesehen" hinterlegt - genau so,
          # wie es nach dem ersten echten Start eines Anwenders aussieht.
          # appVersion muss mitgesetzt werden, sonst loescht
          # check_app_version_and_reset_if_necessary() den Disclaimer-Merker.
          s = QSettings("KVRouite", "KVRouite")
          s.setValue("appVersion", config.APP_VERSION)
          s.setValue("disclaimerAccepted", True)
          s.setValue("hints/ffmpeg_missing_shown", True)
          s.sync()
          print("Vorbelegt fuer Version", config.APP_VERSION)

          # main() endet mit app.exec(). Statt dort in die Ereignisschleife zu
          # gehen, wird nachgesehen, welche Fenster offen sind - und zurueck.
          gefunden = []
          def statt_exec(self):
              for w in self.topLevelWidgets():
                  if w.isVisible():
                      gefunden.append((type(w).__name__, w.windowTitle()))
              return 0
          QApplication.exec = statt_exec

          try:
              KVRouite.main()
          except SystemExit as e:
              if e.code not in (0, None):
                  print("main() hat sich mit Code", e.code, "beendet")
                  sys.exit(1)

          print("Sichtbare Fenster beim Erreichen der Ereignisschleife:")
          for name, titel in gefunden:
              print("   ", name, "-", repr(titel))

          if any(n == "MainWindow" for n, _ in gefunden):
              print("ERGEBNIS: Hauptfenster wurde aufgebaut und angezeigt.")
          else:
              print("ERGEBNIS: KEIN Hauptfenster - die App kam nicht so weit.")
              sys.exit(1)
          PY

      - name: GPX-Rundlauf pruefen (lesen, exportieren, wieder lesen)
        run: |
          cat > ci_test.gpx <<'GPX'
          <?xml version="1.0" encoding="UTF-8"?>
          <gpx version="1.1" creator="KVRouite-CI" xmlns="http://www.topografix.com/GPX/1/1">
            <trk><name>CI</name><trkseg>
              <trkpt lat="50.9400" lon="6.9600"><ele>50.0</ele><time>2026-01-01T10:00:00Z</time></trkpt>
              <trkpt lat="50.9410" lon="6.9610"><ele>55.0</ele><time>2026-01-01T10:00:02Z</time></trkpt>
              <trkpt lat="50.9420" lon="6.9620"><ele>60.0</ele><time>2026-01-01T10:00:04Z</time></trkpt>
              <trkpt lat="50.9430" lon="6.9630"><ele>58.0</ele><time>2026-01-01T10:00:06Z</time></trkpt>
              <trkpt lat="50.9440" lon="6.9640"><ele>62.0</ele><time>2026-01-01T10:00:08Z</time></trkpt>
            </trkseg></trk>
          </gpx>
          GPX
          python - <<'PY'
          import os, sys
          from core.gpx_parser import parse_gpx, recalc_gpx_data

          # ---- 1. Einlesen -------------------------------------------------
          punkte = parse_gpx("ci_test.gpx")
          print("Punkte gelesen:", len(punkte))
          if len(punkte) != 5:
              print("ERGEBNIS: erwartet 5 Punkte, bekommen", len(punkte))
              sys.exit(1)
          print("erster Punkt:", punkte[0])

          recalc_gpx_data(punkte)
          print("letzter Punkt nach recalc:", punkte[-1])

          # ---- 2. Exportieren ----------------------------------------------
          # _save_gpx_to_file benutzt kein self, laesst sich also ohne
          # Hauptfenster aufrufen - es ist derselbe Schreiber, den der
          # Menuepunkt "Export GPX..." verwendet.
          from views.mainwindow import MainWindow
          ZIEL = "ci_export.gpx"
          MainWindow._save_gpx_to_file(None, punkte, ZIEL)
          if not os.path.isfile(ZIEL):
              print("ERGEBNIS: Es wurde keine GPX-Datei geschrieben.")
              sys.exit(1)
          print(f"geschrieben: {ZIEL}, {os.path.getsize(ZIEL)} Bytes")

          # ---- 3. Rundlauf: das Geschriebene wieder einlesen ----------------
          zurueck = parse_gpx(ZIEL)
          print("wieder gelesen:", len(zurueck), "Punkte")

          fehler = []
          if len(zurueck) != len(punkte):
              fehler.append(f"{len(punkte)} Punkte geschrieben, {len(zurueck)} zurueckgelesen")
          else:
              for i, (a, b) in enumerate(zip(punkte, zurueck)):
                  for feld in ("lat", "lon", "ele"):
                      va, vb = a.get(feld), b.get(feld)
                      if va is None or vb is None or abs(float(va) - float(vb)) > 1e-6:
                          fehler.append(f"Punkt {i}: {feld} {va} != {vb}")
                  if a.get("time") and b.get("time") and a["time"] != b["time"]:
                      fehler.append(f"Punkt {i}: Zeit {a['time']} != {b['time']}")

          print("--- Anfang der erzeugten Datei ---")
          with open(ZIEL, encoding="utf-8") as f:
              for zeile in f.readlines()[:12]:
                  print("   ", zeile.rstrip())
          print("--- Ende des Ausschnitts ---")

          if fehler:
              for f_ in fehler[:10]:
                  print("  PROBLEM:", f_)
              print("ERGEBNIS: Der GPX-Rundlauf stimmt nicht.")
              sys.exit(1)

          print("ERGEBNIS: GPX-Rundlauf in Ordnung - lesen, exportieren und "
                "wieder einlesen liefert dieselben Punkte.")
          PY

      - name: Export-Test - echtes Rendern ueber GES
        timeout-minutes: 10
        run: |
          python - <<'PY'
          import json, os, sys
          import gi
          gi.require_version("Gst", "1.0")
          gi.require_version("GstPbutils", "1.0")
          from gi.repository import Gst, GstPbutils
          Gst.init(None)

          # ---- 1. Testmaterial erzeugen -----------------------------------
          # 8 Sekunden 640x360 bei 30 fps, ohne Ton - der Export von KVRouite
          # rendert ohnehin "MP4 without audio".
          QUELLE = os.path.abspath("ci_quelle.mp4")
          rohr = Gst.parse_launch(
              "videotestsrc num-buffers=240 pattern=ball ! "
              "video/x-raw,width=640,height=360,framerate=30/1 ! "
              "x264enc key-int-max=30 ! mp4mux ! "
              f"filesink location={QUELLE}")
          rohr.set_state(Gst.State.PLAYING)
          nachricht = rohr.get_bus().timed_pop_filtered(
              30 * Gst.SECOND, Gst.MessageType.EOS | Gst.MessageType.ERROR)
          rohr.set_state(Gst.State.NULL)
          if nachricht is None or nachricht.type == Gst.MessageType.ERROR:
              print("Testvideo konnte nicht erzeugt werden:",
                    nachricht.parse_error() if nachricht else "Zeitueberschreitung")
              sys.exit(1)
          print(f"Testvideo: {os.path.getsize(QUELLE)} Bytes")

          def pruefen(pfad):
              """Dauer in Sekunden und Videocodec einer Datei."""
              disc = GstPbutils.Discoverer.new(20 * Gst.SECOND)
              info = disc.discover_uri(Gst.filename_to_uri(pfad))
              vs = info.get_video_streams()[0]
              caps = vs.get_caps().to_string().split(",")[0]
              return info.get_duration() / Gst.SECOND, caps, vs.get_width(), vs.get_height()

          dauer, codec, br, ho = pruefen(QUELLE)
          print(f"  Quelle: {dauer:.2f}s, {codec}, {br}x{ho}")

          # ---- 2. Welche Encoder gibt es hier ueberhaupt? ------------------
          for name in ("x264enc", "x265enc"):
              da = Gst.ElementFactory.make(name, None) is not None
              print(("  vorhanden: " if da else "  FEHLT   : ") + name)

          # ---- 3. Export fahren -------------------------------------------
          # Genau der Weg, den auch encoder_manager.py:488 geht.
          from managers.ges_encoder_manager import ges_xfade_main

          ZIEL = os.path.abspath("ci_export.mp4")
          cfg = {
              "videos": [QUELLE],
              # 3.0s bis 5.0s herausschneiden, mit 1 s Ueberblendung am Schnitt
              "skip_instructions": [[3.0, 5.0, 1.0]],
              "overlay_instructions": [],
              "final_output": ZIEL,
              "encoder": "libx264",
              "hardware_encode": "none",
              "crf": 28,
              "fps": "30/1",
              "width": 640,
          }
          with open("ci_cfg.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f)

          print()
          print("=== Ausgabe von ges_xfade_main ===")
          ges_xfade_main("ci_cfg.json")
          print("=== Ende der Ausgabe ===")
          print()

          # ---- 4. Ergebnis pruefen ----------------------------------------
          if not os.path.isfile(ZIEL):
              print("ERGEBNIS: Es wurde keine Datei erzeugt.")
              sys.exit(1)
          groesse = os.path.getsize(ZIEL)
          dauer_z, codec_z, br_z, ho_z = pruefen(ZIEL)
          print(f"  Ergebnis: {groesse} Bytes, {dauer_z:.2f}s, {codec_z}, {br_z}x{ho_z}")

          # 8s Quelle minus 2s Schnitt = rund 6s. Grosszuegige Grenzen, weil
          # die Ueberblendung die Laenge leicht verschiebt.
          fehler = []
          if groesse < 10000:
              fehler.append(f"Datei ist mit {groesse} Bytes zu klein")
          if not (5.0 <= dauer_z <= 7.0):
              fehler.append(f"Dauer {dauer_z:.2f}s liegt nicht bei den erwarteten ~6s")
          if "h264" not in codec_z:
              fehler.append(f"unerwarteter Codec: {codec_z}")
          if (br_z, ho_z) != (640, 360):
              fehler.append(f"unerwartete Groesse: {br_z}x{ho_z}")

          if fehler:
              for f_ in fehler:
                  print("  PROBLEM:", f_)
              print("ERGEBNIS: Export lief, das Ergebnis stimmt aber nicht.")
              sys.exit(1)

          print("ERGEBNIS: Export ueber GES funktioniert - Schnitt, Ueberblendung "
                "und x264-Kodierung inbegriffen.")
          PY

      - name: Ergebnisvideo zum Herunterladen bereitstellen
        if: always()          # auch bei Fehlschlag, dann sieht man das Bruchstueck
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ matrix.os }}
          path: |
            ci_export.mp4
            ci_quelle.mp4
            ci_cfg.json
            ci_export.gpx
          if-no-files-found: warn
          retention-days: 14

      - name: GStreamer-Plugins auflisten (zur Information)
        if: always()
        run: |
          python - <<'PY'
          import gi
          gi.require_version("Gst", "1.0")
          from gi.repository import Gst
          Gst.init(None)
          reg = Gst.Registry.get()
          namen = sorted(p.get_name() for p in reg.get_plugin_list())
          print(len(namen), "Plugins gefunden")
          for n in ("coreelements", "libav", "x264", "ges", "playback", "videoconvertscale"):
              print(("  vorhanden: " if n in namen else "  FEHLT   : ") + n)
          PY
