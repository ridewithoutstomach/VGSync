# Baut das macOS-Anwendungsbuendel und legt es als Artefakt ab.
#
# Laeuft NUR AUF KNOPFDRUCK, nicht bei jedem Push. Der Grund: ein Build zieht
# die gesamte GStreamer-Laufzeit mit und dauert entsprechend lange. Bei jedem
# Push mitzulaufen waere Verschwendung fremder Rechenzeit, und gebraucht wird
# ein Buendel nur dann, wenn wirklich eines gebraucht wird.
#
# Der Testlauf (macos.yml) bleibt davon unberuehrt - der ist kurz und darf bei
# jedem Push laufen.
#
# Starten geht auf zwei Wegen:
#
#   1. Reiter "Actions" -> "macOS Build" -> "Run workflow".
#      ACHTUNG: Diesen Knopf zeigt GitHub nur, wenn diese Datei im
#      STANDARDBRANCH liegt (main). Solange sie nur auf einem Arbeitszweig
#      steht, gibt es ihn nicht - das ist eine Regel von GitHub, kein Fehler.
#
#   2. Bis dahin: der Lauf startet, sobald sich eine der drei Dateien aendert,
#      die zum Bauen gehoeren (siehe paths unten). Ein Kommentar in
#      build_macos.py genuegt, um ihn auszuloesen. Bei allen anderen Pushs
#      passiert nichts - genau das war ja der Sinn.

name: macOS Build

on:
  workflow_dispatch:        # der Knopf, sobald die Datei in main liegt
  push:
    paths:                  # sonst nur, wenn am Bauen selbst etwas geaendert wird
      - "build_macos.py"
      - "requirements-build-macos.txt"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    name: ${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60      # ein Buendel mit GStreamer braucht seine Zeit
    strategy:
      fail-fast: false       # bricht ein Ziel, laeuft das andere trotzdem
      matrix:
        include:
          - os: macos-15
            arch: arm64          # Apple Silicon, M1 bis M4
          - os: macos-15-intel
            arch: x86_64         # Intel

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Umgebung anzeigen
        run: |
          echo "Rechner : $(uname -m) / $(sw_vers -productVersion)"
          echo "Python  : $(python --version)"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build-macos.txt

      - name: Was tatsaechlich installiert wurde
        run: pip list

      - name: Buendel bauen
        run: python build_macos.py

      - name: Was im Buendel gelandet ist
        run: |
          BUENDEL=$(find dist -maxdepth 2 -name "KVRouite.app" -type d | head -1)
          echo "Buendel: $BUENDEL"
          echo "Groesse: $(du -sh "$BUENDEL" | cut -f1)"
          echo
          echo "----- Contents/MacOS (dort sucht die App ihre Dateien) -----"
          ls -1 "$BUENDEL/Contents/MacOS" | head -30
          echo
          echo "----- Contents/Resources (Rechtstexte, doc) -----"
          ls -1 "$BUENDEL/Contents/Resources" | head -30
          echo
          echo "----- Architektur -----"
          # Der Dateiname des Archivs verspricht eine Architektur. Hier wird
          # geprueft, dass das Programm sie auch hat - sonst laedt sich jemand
          # ein Buendel herunter, das auf seinem Mac nicht startet.
          ARCH=$(lipo -archs "$BUENDEL/Contents/MacOS/KVRouite")
          echo "gebaut: $ARCH / erwartet: ${{ matrix.arch }}"
          if [ "$ARCH" != "${{ matrix.arch }}" ]; then
            echo "ABBRUCH: Das Buendel passt nicht zu seinem Namen."
            exit 1
          fi
          echo
          echo "----- Info.plist -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$BUENDEL/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$BUENDEL/Contents/Info.plist" || true

      # ---------------------------------------------------------------
      # Ab hier wird NICHT mehr im Bauordner geprueft, sondern in dem, was der
      # Anwender herunterlaedt. Das Archiv wird ausgepackt, und jeder weitere
      # Schritt fasst nur noch dieses Buendel an. Damit ist die Reihenfolge
      # zwangslaeufig richtig: signiert hat build_macos.py als letzten Schritt,
      # gepackt wurde danach, angefasst wird erst das Ausgepackte.
      # ---------------------------------------------------------------
      - name: Auslieferungsstand herstellen
        run: |
          ZIP=$(find dist -name "KVRouite_*_macOS_*.zip" | head -1)
          echo "Archiv: $ZIP"
          rm -rf pruefstand && mkdir pruefstand
          ditto -x -k "$ZIP" pruefstand
          APP=$(find pruefstand -maxdepth 2 -name "KVRouite.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ABBRUCH: im Archiv steckt kein KVRouite.app."
            exit 1
          fi
          echo "Geprueft wird ab jetzt: $PWD/$APP"
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"

      - name: Ist das Buendel gueltig signiert?
        run: |
          echo "----- Wer hat signiert -----"
          codesign -dv --verbose=4 "$APP"
          echo
          echo "----- Steht jede Datei im Siegel? -----"
          # Harter Abbruch. Genau diese Pruefung fehlte: bis zum 03.09.2026
          # liess build_macos.py das Buendel von PyInstaller signieren und
          # kopierte DANACH noch Dateien hinein. Auf dem Mac eines Anwenders
          # meldete codesign daraufhin fuer jede davon "a sealed resource is
          # missing or invalid" - hier lief der Bau trotzdem gruen durch.
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "OK: Siegel vollstaendig, Signatur gueltig."

      - name: Gegenprobe - schlaegt diese Pruefung ueberhaupt an?
        run: |
          # Ein Test, der nie fehlschlaegt, beweist nichts. Deshalb wird hier
          # eine KOPIE absichtlich kaputtgemacht, und zwar auf genau die Art,
          # die uns passiert ist: eine Datei nachtraeglich hineinlegen. Meldet
          # codesign das nicht, taugt der Schritt darueber nichts, und dann
          # soll dieser Lauf abbrechen statt falsche Sicherheit zu liefern.
          rm -rf kaputt && mkdir kaputt
          # ditto und nicht cp: ditto kopiert ein Buendel samt allem,
          # was zur Signatur gehoert. Eine unsaubere Kopie wuerde
          # codesign schon von sich aus bemaengeln, und die Gegenprobe
          # wuerde bestehen, ohne etwas bewiesen zu haben.
          ditto "$APP" "kaputt/KVRouite.app"
          echo "nachtraeglich hineingelegt" > "kaputt/KVRouite.app/Contents/MacOS/eingeschmuggelt.txt"
          if codesign --verify --deep --strict --verbose=2 "kaputt/KVRouite.app"; then
            echo "ABBRUCH: codesign meldet ein nachtraeglich veraendertes Buendel NICHT."
            echo "Damit waere die Pruefung im Schritt davor wertlos."
            exit 1
          fi
          echo "OK: eine nachtraeglich hineingelegte Datei wird erkannt."
          echo "Die Pruefung im Schritt davor hat also Zaehne."
          rm -rf kaputt

      - name: Was Gatekeeper beim Anwender sagen wird
        run: |
          # Der Unterschied zwischen "laeuft auf dem Bauserver" und "laeuft
          # beim Anwender" ist ein einziges Dateimerkmal: com.apple.quarantine
          # setzt der Browser beim Herunterladen, und erst damit schaut
          # Gatekeeper ueberhaupt hin. Hier wird es von Hand gesetzt, damit im
          # Protokoll steht, was der Anwender wirklich zu sehen bekommt.
          xattr -w com.apple.quarantine "0081;00000000;Chrome;" "$APP"
          echo "----- spctl, also Gatekeeper -----"
          spctl -a -t exec -vv "$APP" 2>&1 || true
          echo
          echo "Ohne Notarisierung sagt Gatekeeper hier zwangslaeufig nein -"
          echo "das ist so entschieden und kein Fehler. Entscheidend ist, WAS"
          echo "er sagt: not notarized allein ist der bekannte Stand. Steht"
          echo "dort etwas ueber ein ungueltiges oder unvollstaendiges Siegel,"
          echo "ist etwas kaputt."
          xattr -dr com.apple.quarantine "$APP"

      - name: Selbsttest im ausgelieferten Buendel
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echo "Der eigentliche Test: das Buendel prueft sich selbst."
          echo "Es findet seine Dateien, laedt die Symbole, liest und schreibt"
          echo "GPX und schneidet ein Video - siehe selftest.py."
          echo
          # Aus einem FREMDEN Ordner starten. Beim Doppelklick auf ein Buendel
          # ist das Arbeitsverzeichnis nicht der Programmordner, und genau
          # daran sind die Symbole zuerst gescheitert.
          cd /
          "$APP/Contents/MacOS/KVRouite" --selftest

      - name: Startet das ausgelieferte Buendel?
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          echo "Starte: $APP/Contents/MacOS/KVRouite"
          # Der erste Start zeigt sonst zwei modale Dialoge (Disclaimer und
          # "ffmpeg not found") und wartet ewig auf einen Klick. Beide werden
          # wie nach einem ersten echten Start vorbelegt.
          python -c "from PySide6.QtCore import QSettings; import config; s = QSettings('KVRouite', 'KVRouite'); s.setValue('appVersion', config.APP_VERSION); s.setValue('disclaimerAccepted', True); s.setValue('hints/ffmpeg_missing_shown', True); s.sync(); print('Einstellungen vorbelegt fuer', config.APP_VERSION)"
          "$APP/Contents/MacOS/KVRouite" > start.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then
            echo "ERGEBNIS: Das Buendel laeuft nach 25 Sekunden noch."
            kill $PID 2>/dev/null
            RC=0
          else
            wait $PID; CODE=$?
            echo "ERGEBNIS: Das Buendel hat sich vorzeitig beendet, Code $CODE"
            RC=1
          fi
          echo "----- Ausgabe -----"
          cat start.log
          echo "-------------------"
          exit $RC

      - name: Nachweisbilder vom laufenden Fenster
        if: always()
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Der Startversuch oben zeigt nur, dass der Prozess noch lebt. Hier
          # laedt die Anwendung eine GPX-Spur und ein Testvideo, drueckt auf
          # Wiedergabe und macht DREI Bilder im Abstand von zwei Sekunden
          # (nachweis.py). Wer sie nebeneinanderlegt, sieht an der
          # Abspielmarke und am Ball im Testvideo, dass wirklich etwas lief -
          # ein einzelnes Standbild koennte auch ein eingefrorenes Fenster
          # sein. Aufgenommen wird von Qt selbst (QWidget.grab), deshalb geht
          # es auch ohne Bildschirm.
          "$APP/Contents/MacOS/KVRouite" --screenshot
          ls -l KVRouite_screenshot_*.png

      - name: Hat das Laufen das Buendel veraendert?
        if: always()
        run: |
          # Letzte Gegenprobe: nach allen Startversuchen muss das Siegel immer
          # noch stimmen. Legt das Programm beim ersten Start etwas in sein
          # eigenes Buendel, waere es beim Anwender ab dann "veraendert" - und
          # wir wuessten es wieder nicht.
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "OK: das Buendel ist nach dem Laufen unveraendert."

      - name: Nachweisbilder ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KVRouite-macOS-${{ matrix.arch }}-screenshot
          path: KVRouite_screenshot_*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Buendel ablegen
        if: always()          # auch bei fehlgeschlagenem Startversuch abholbar
        uses: actions/upload-artifact@v4
        with:
          name: KVRouite-macOS-${{ matrix.arch }}
          path: |
            dist/*/KVRouite_*_macOS_*.zip
            dist/*/KVRouite_*_macOS_*.zip.sha256
          if-no-files-found: error
          retention-days: 14
