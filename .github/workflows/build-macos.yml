# Baut das macOS-Anwendungsbuendel und legt es als Artefakt ab.
#
# Laeuft NUR AUF KNOPFDRUCK, nicht bei jedem Push. Der Grund: ein Build zieht
# die gesamte GStreamer-Laufzeit mit und dauert entsprechend lange. Bei jedem
# Push mitzulaufen waere Verschwendung fremder Rechenzeit, und gebraucht wird
# ein Buendel nur dann, wenn wirklich eines gebraucht wird.
#
# Der Testlauf (macos.yml) bleibt davon unberuehrt - der ist kurz und darf bei
# jedem Push laufen.
#
# Starten geht auf zwei Wegen:
#
#   1. Reiter "Actions" -> "macOS Build" -> "Run workflow".
#      ACHTUNG: Diesen Knopf zeigt GitHub nur, wenn diese Datei im
#      STANDARDBRANCH liegt (main). Solange sie nur auf einem Arbeitszweig
#      steht, gibt es ihn nicht - das ist eine Regel von GitHub, kein Fehler.
#
#   2. Bis dahin: der Lauf startet, sobald sich eine der drei Dateien aendert,
#      die zum Bauen gehoeren (siehe paths unten). Ein Kommentar in
#      build_macos.py genuegt, um ihn auszuloesen. Bei allen anderen Pushs
#      passiert nichts - genau das war ja der Sinn.

name: macOS Build

on:
  workflow_dispatch:        # der Knopf, sobald die Datei in main liegt
  push:
    paths:                  # sonst nur, wenn am Bauen selbst etwas geaendert wird
      - "build_macos.py"
      - "requirements-build-macos.txt"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60      # ein Buendel mit GStreamer braucht seine Zeit
    strategy:
      fail-fast: false       # bricht ein Ziel, laeuft das andere trotzdem
      matrix:
        include:
          - os: macos-15         # Apple Silicon (arm64)
          - os: macos-15-intel   # Intel (x86_64)

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Umgebung anzeigen
        run: |
          echo "Rechner : $(uname -m) / $(sw_vers -productVersion)"
          echo "Python  : $(python --version)"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build-macos.txt

      - name: Was tatsaechlich installiert wurde
        run: pip list

      - name: Buendel bauen
        run: python build_macos.py

      - name: Was im Buendel gelandet ist
        run: |
          BUENDEL=$(find dist -maxdepth 2 -name "KVRouite.app" -type d | head -1)
          echo "Buendel: $BUENDEL"
          echo "Groesse: $(du -sh "$BUENDEL" | cut -f1)"
          echo
          echo "----- Contents/MacOS (dort sucht die App ihre Dateien) -----"
          ls -1 "$BUENDEL/Contents/MacOS" | head -30
          echo
          echo "----- Contents/Resources (Rechtstexte, doc) -----"
          ls -1 "$BUENDEL/Contents/Resources" | head -30
          echo
          echo "----- Info.plist -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$BUENDEL/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$BUENDEL/Contents/Info.plist" || true

      - name: Selbsttest im gebauten Buendel
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BUENDEL=$(find dist -maxdepth 2 -name "KVRouite.app" -type d | head -1)
          PROG="$BUENDEL/Contents/MacOS/KVRouite"
          echo "Der eigentliche Test: das Buendel prueft sich selbst."
          echo "Es findet seine Dateien, laedt die Symbole, liest und schreibt"
          echo "GPX und schneidet ein Video - siehe selftest.py."
          echo
          # Aus einem FREMDEN Ordner starten. Beim Doppelklick auf ein Buendel
          # ist das Arbeitsverzeichnis nicht der Programmordner, und genau
          # daran sind die Symbole zuerst gescheitert.
          cd /
          "$OLDPWD/$PROG" --selftest

      - name: Startet das gebaute Buendel?
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          BUENDEL=$(find dist -maxdepth 2 -name "KVRouite.app" -type d | head -1)
          PROG="$BUENDEL/Contents/MacOS/KVRouite"
          echo "Starte: $PROG"
          # Der erste Start zeigt sonst zwei modale Dialoge (Disclaimer und
          # "ffmpeg not found") und wartet ewig auf einen Klick. Beide werden
          # wie nach einem ersten echten Start vorbelegt.
          python - <<'PY'
          from PySide6.QtCore import QSettings
          import config
          s = QSettings("KVRouite", "KVRouite")
          s.setValue("appVersion", config.APP_VERSION)
          s.setValue("disclaimerAccepted", True)
          s.setValue("hints/ffmpeg_missing_shown", True)
          s.sync()
          print("Einstellungen vorbelegt fuer", config.APP_VERSION)
          PY
          "$PROG" > start.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then
            echo "ERGEBNIS: Das Buendel laeuft nach 25 Sekunden noch."
            kill $PID 2>/dev/null
            RC=0
          else
            wait $PID; CODE=$?
            echo "ERGEBNIS: Das Buendel hat sich vorzeitig beendet, Code $CODE"
            RC=1
          fi
          echo "----- Ausgabe -----"
          cat start.log
          echo "-------------------"
          exit $RC

      - name: Buendel ablegen
        if: always()          # auch bei fehlgeschlagenem Startversuch abholbar
        uses: actions/upload-artifact@v4
        with:
          name: KVRouite-macOS-${{ matrix.os }}
          path: |
            dist/*/KVRouite_*_macOS.zip
            dist/*/KVRouite_*_macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14
